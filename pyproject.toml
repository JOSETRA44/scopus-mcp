[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "josetra-scopus-mcp"
version = "0.1.0"
description = "MCP server for the Elsevier Scopus academic research API — search 100M+ papers, retrieve abstracts, analyze author impact, and track citation trends"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "JOSETRA44", email = "drivearchiver@gmail.com" },
]
keywords = ["mcp", "scopus", "elsevier", "academic", "research", "model-context-protocol", "llm", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # mcp 2.0 movió mcp.server.fastmcp; con >=1.0.0 sin techo, una
    # instalación nueva desde PyPI resuelve a 2.x y la herramienta
    # falla al importar. Se levanta el techo cuando se migre el server.
    "mcp>=1.28.0,<2.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "anyio>=4.0.0",
    "platformdirs>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/JOSETRA44/scopus-mcp"
Repository = "https://github.com/JOSETRA44/scopus-mcp"
"Bug Tracker" = "https://github.com/JOSETRA44/scopus-mcp/issues"
Changelog = "https://github.com/JOSETRA44/scopus-mcp/releases"

[project.scripts]
josetra-scopus-mcp = "scopus_mcp.cli:main"
scopus-mcp = "scopus_mcp.cli:main"
scopus = "scopus_mcp.cli:main"
scps = "scopus_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/scopus_mcp"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/scripts", "/docs", "/.github", "/pyproject.toml", "/README.md", "/LICENSE", "/CHANGELOG.md", "/IMPLEMENTATION.md", "/server.json"]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
    "ruff>=0.11.0",
    "mypy>=1.15.0",
    "build>=1.2.0",
    "twine>=6.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
# Start with correctness checks; avoid a cosmetic rewrite of existing code.
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.11"
# Grow this boundary as the CLI and MCP adapters acquire typed result models.
files = ["src/scopus_mcp/cache.py", "src/scopus_mcp/client.py", "src/scopus_mcp/exceptions.py"]
follow_imports = "silent"
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
